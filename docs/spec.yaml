# These are MANDATORY - all checks must pass for the SDK to be release-ready
quality_requirements:
  code_coverage:
    minimum: 80
    tool: "go test with coverage"
    command: "go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | grep total"
    html_report: "go tool cover -html=coverage.out -o coverage.html"
    critical_packages:
      - "internal/http"               # HTTP client and middleware
      - "internal/http (retry logic)" # Retry logic
      - "."                           # Main package (client, errors)

  compilation:
    tool: "go build"
    command: "go build ./..."
    notes:
      - "Go compiler ensures type safety at compile time"
      - "No separate type checker needed - types are enforced by the compiler"

  code_formatting:
    tool: "gofmt"
    version: "built-in"               # Part of Go toolchain
    command: "gofmt -l -s ."
    check_command: "test -z $(gofmt -l -s .)"
    import_formatting: "goimports -l ."
    notes:
      - "Use -s flag for simplify code"
      - "goimports also organizes imports"

  linting:
    tool: "golangci-lint"
    version: ">=1.55.0"
    command: "golangci-lint run"
    config_file: ".golangci.yml"
    enabled_linters:
      - "errcheck"                    # Check error returns
      - "gosimple"                    # Suggest code simplifications
      - "govet"                       # Go vet built-in checks
      - "ineffassign"                 # Detect ineffectual assignments
      - "staticcheck"                 # Advanced static analysis
      - "unused"                      # Check for unused code
      - "gofmt"                       # Ensure gofmt compliance
      - "goimports"                   # Ensure imports are formatted
      - "misspell"                    # Spell checking
      - "revive"                      # Golint replacement
      - "gosec"                       # Security checks
    notes:
      - "golangci-lint runs multiple linters in parallel"
      - "Configure in .golangci.yml for custom rules"

  static_analysis:
    tool: "go vet"
    command: "go vet ./..."
    purpose: "Examine Go source code and report suspicious constructs"

  go_mod_tidy:
    tool: "go mod"
    command: "go mod tidy && git diff --exit-code go.mod go.sum"
    purpose: "Ensure go.mod and go.sum are up to date"

  struct_tags:
    notes:
      - "Use json tags for all exported struct fields that map to API"
      - "Format: `json:\"camelCaseField,omitempty\"`"
      - "Use omitempty for optional/pointer fields"
      - "Example struct definition:"
