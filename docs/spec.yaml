          Rate            float64  `json:"rate"`
          RateID          *string  `json:"rateId,omitempty"`
          JurType         string   `json:"jurType"`
          JurName         string   `json:"jurName"`
          JurDescription  *string  `json:"jurDescription,omitempty"`
          JurTaxCode      *string  `json:"jurTaxCode,omitempty"`
      }

  error_handling:
    requirements:
      - "All errors must be checked and handled"
      - "Use fmt.Errorf with %w for error wrapping"
      - "Define sentinel errors for common error conditions"
      - "Never use panic in library code"
    example: |
      // Define sentinel errors
      var (
          ErrInvalidAPIKey = errors.New("invalid API key")
          ErrRateLimitExceeded = errors.New("rate limit exceeded")
      )

      // Wrap errors with context
