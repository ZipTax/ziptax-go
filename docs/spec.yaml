# =============================================================================
# SDK Generation Template for ZipTax API
# =============================================================================
# This template provides a comprehensive spec for codegen agents

# -----------------------------------------------------------------------------
# Project Metadata
# -----------------------------------------------------------------------------
project:
  name: "ziptax-go"
  language: "go"
  version: "0.2.3-beta"
  description: "Official Go SDK for the ZipTax and TaxCloud APIs"
  module_path: "github.com/ziptax/ziptax-go"
  minimum_go_version: "1.21"

  # Repository information
  repository:
    url: "https://github.com/ziptax/ziptax-go"
    type: "git"

  # License
  license: "MIT"

  # Maintainer information
  maintainers:
    - name: "ZipTax Team"
      email: "support@zip.tax"

# -----------------------------------------------------------------------------
# API Configuration
# -----------------------------------------------------------------------------
# The SDK now supports TWO APIs:
# 1. ZipTax API - For tax rate lookups and account metrics (REQUIRED)
# 2. TaxCloud API - For order management operations (OPTIONAL)

api:
  # Primary API (ZipTax) - REQUIRED for all SDK functionality
  ziptax:
    name: "ZipTax API"
    version: "v60"
    base_url: "https://api.zip-tax.com/"

    # API specification source
    spec:
      type: "openapi"
      version: "3.0.0"
      source: "https://api.zip-tax.com/openapi.json"

    # Authentication methods
    authentication:
      type: "api_key"
      location: "header"
      parameter_name: "X-API-Key"
      required: true

  # Secondary API (TaxCloud) - OPTIONAL for order management
  taxcloud:
    name: "TaxCloud API"
    version: "v3"
    base_url: "https://api.v3.taxcloud.com/"
    documentation: "https://docs.taxcloud.com/api-reference/api-reference/sales-tax-api/orders/create-order"

    # Authentication methods
    authentication:
      type: "api_key"
      location: "header"
      parameter_name: "X-API-Key"
      required: false  # Only required if using TaxCloud features

    # Additional authentication requirements
    required_parameters:
      - name: "connectionId"
        description: "TaxCloud Connection ID (UUID format) - used in API paths"
        format: "uuid"
        example: "25eb9b97-5acb-492d-b720-c03e79cf715a"

    # Feature availability notes
    notes:
      - "TaxCloud features are OPTIONAL and only available when both Connection ID and API Key are provided during client initialization"
      - "Order management functions will return error if TaxCloud credentials not configured"
      - "Uses Header authentication with the X-API-KEY header for boths APIs, but TaxCloud also requires the connectionId in the path for order endpoints"

# -----------------------------------------------------------------------------
# SDK Configuration
# -----------------------------------------------------------------------------
sdk:
  # Package/module naming
  package_name: "ziptax"
  namespace: "Ziptax"

  # SDK structure approach
  structure:
    type: "client-based"
    client_struct: "Client"        # Go uses structs, not classes

  # Features to include
  features:
    concurrency_support: true      # Include goroutines/channels for concurrent operations
    context_support: true          # Use context.Context for cancellation and timeouts
    retry_logic: true              # Automatic retry on failures with exponential backoff
    request_logging: true          # Built-in request/response logging
    response_caching: false        # Cache responses
    pagination_helpers: true       # Helper methods for paginated endpoints
    batch_operations: false        # Batch request support
    webhooks: false                # Webhook handling utilities

  # Error handling
  error_handling:
    use_custom_errors: true        # Go uses errors, not exceptions
    error_wrapping: true           # Use fmt.Errorf with %w for error chains
    sentinel_errors: true          # Define sentinel errors (e.g., ErrInvalidAPIKey)
    include_retry_errors: true

  # Type safety
  type_safety:
    use_strict_types: true         # Go is statically typed
    validate_inputs: true          # Runtime input validation
    use_interfaces: true           # Define interfaces for extensibility

# -----------------------------------------------------------------------------
# API Endpoints & Resources
# -----------------------------------------------------------------------------
# Define the API structure and endpoints to implement
resources:
      - name: "GetSalesTaxByAddress"
        http_method: "GET"
        path: "/request/v60/"
        description: "Returns sales and use tax rate details from an address input."
        operation_id: "getTaxRatesV60"
        parameters:
          - name: "address"
            type: "string"
            required: true
            location: "query"
            description: "Full or partial street address for geocoding"
            validation:
              max_length: 100
          - name: "taxabilityCode"
            type: "string"
            format: "number"
            required: false
            location: "query"
            description: "Taxability Code (product or service code)"
            validation:
              pattern: "^[0-9]+$"
          - name: "countryCode"
            type: "string"
            required: false
            location: "query"
            description: "Country code"
            default: "USA"
            enum: ["USA", "CAN"]
          - name: "historical"
            type: "string"
            format: "date"
            required: false
            location: "query"
            description: "Historical date for rates (YYYYMM format, e.g., 202401)"
            validation:
              pattern: "^[0-9]{4}[0-9]{2}$"
          - name: "format"
            type: "string"
            required: false
            location: "query"
            description: "Response format"
            default: "json"
            enum: ["json", "xml"]
        returns:
          type: "V60Response"
          is_array: false
      - name: "GetSalesTaxByGeoLocation"
        http_method: "GET"
        path: "/request/v60/"
        description: "Returns sales and use tax rate details from a geolocation input."
        operation_id: "getTaxRatesV60"
        parameters:
          - name: "lat"
            type: "string"
            required: true
            location: "query"
            description: "Latitude for geolocation"
            validation:
              max_length: 100
          - name: "lng"
            type: "string"
            required: true
            location: "query"
            description: "Longitude for geolocation"
            validation:
              max_length: 100
          - name: "countryCode"
            type: "string"
            required: false
            location: "query"
            description: "Country code"
            default: "USA"
            enum: ["USA", "CAN"]
          - name: "historical"
            type: "string"
            format: "date"
            required: false
            location: "query"
            description: "Historical date for rates (YYYYMM format, e.g., 202401)"
            validation:
              pattern: "^[0-9]{4}[0-9]{2}$"
          - name: "format"
            type: "string"
            required: false
            location: "query"
            description: "Response format"
            default: "json"
            enum: ["json", "xml"]
        returns:
          type: "V60Response"
          is_array: false
      - name: "GetAccountMetrics"
        http_method: "GET"
        path: "/account/v60/metrics"
        description: "Returns account metrics related to sales and use tax."
        operation_id: "getAccountMetricsV60"
        parameters:
          - name: "key"
            type: "string"
            required: false
            location: "query"
            description: "Response format"
            default: "json"
            enum: ["json", "xml"]
        returns:
          type: "V60AccountMetrics"
          is_array: false
      - name: "GetRatesByPostalCode"
        http_method: "GET"
        path: "/request/v60/"
        description: "Returns sales and use tax rate details from a US postal code input."
        operation_id: "getTaxRatesV60ByPostalCode"
        parameters:
          - name: "postalcode"
            type: "string"
            required: true
            location: "query"
            description: "US postal code (5-digit or 9-digit format)"
            validation:
              pattern: "^[0-9]{5}(-[0-9]{4})?$"
          - name: "format"
            type: "string"
            required: false
            location: "query"
            description: "Response format"
            default: "json"
            enum: ["json", "xml"]
        returns:
          type: "V60PostalCodeResponse"
          is_array: false

      # -----------------------------------------------------------------------
      # Cart Tax Calculation - Dual API Routing
      # -----------------------------------------------------------------------
      # The CalculateCart function supports TWO backends:
      #   1. ZipTax API (default) - POST /calculate/cart
      #   2. TaxCloud API (when configured) - POST /tax/connections/{connectionId}/carts
      #
      # Routing logic in Client.CalculateCart:
      #   - If TaxCloud credentials ARE configured (HasTaxCloudCredentials() == true),
      #     route to TaxCloud API and return *TaxCloudCalculateCartResponse
      #   - If TaxCloud credentials are NOT configured, route to ZipTax API
      #     and return *CalculateCartResponse
      #
      # The INPUT contract (CalculateCartRequest) is IDENTICAL for both backends.
      # The SDK handles request transformation internally when routing to TaxCloud.
      # The OUTPUT contract differs: *CalculateCartResponse vs *TaxCloudCalculateCartResponse.
      # The return type uses an interface: CalculateCartResult (implemented by both response types).
      # -----------------------------------------------------------------------

      # ZipTax Cart Tax Calculation Endpoint (default when TaxCloud not configured)
      - name: "CalculateCart"
        api: "ziptax"
        http_method: "POST"
        path: "/calculate/cart"
        description: |
          Calculate sales tax for a single cart with multiple line items.
          Accepts a cart with destination and origin addresses, calculates
          per-item tax, and returns tax rate and amount for each line item.

          ROUTING BEHAVIOR: When the SDK client is initialized with TaxCloud
          credentials (WithTaxCloudConnectionID and WithTaxCloudAPIKey), this
          function automatically routes the request to the TaxCloud API
          instead of the ZipTax API. The input contract (CalculateCartRequest)
          remains the same regardless of which backend is used. The SDK
          transforms the request internally. The response type changes based
          on the backend used.

          IMPLEMENTATION NOTES for routing in Client.CalculateCart:
            1. Check c.HasTaxCloudCredentials() at the START of the method
            2. If true: transform request and POST to TaxCloud, return *TaxCloudCalculateCartResponse
            3. If false: POST to ZipTax as-is (existing behavior), return *CalculateCartResponse
            4. Return type: (CalculateCartResult, error) where CalculateCartResult is an interface
        operation_id: "calculateCart"
        routing:
          condition: "HasTaxCloudCredentials()"
          when_true:
            api: "taxcloud"
            path: "/tax/connections/{connectionId}/carts"
            http_method: "POST"
            returns:
              type: "*TaxCloudCalculateCartResponse"
              status_code: 200
            request_transformation:
              description: |
                The SDK must transform the CalculateCartRequest into the
                TaxCloud request format before sending. The transformation
                maps the ZipTax-style request to TaxCloud's expected schema.
              steps:
                - field: "items[].destination"
                  from: "CartAddress (single string: address)"
                  to: "TaxCloudAddress (structured: line1, city, state, zip, countryCode)"
                  note: |
                    Parse the single address string into structured components.
                    Uses an edges-inward parsing strategy:
                      - Split the address string by comma (minimum 3 segments required)
                      - First segment: street address (Line1)
                      - Last segment: state and zip code (e.g., "CA 92618" or "MN 55401-2427")
                      - Second-to-last segment: city
                      - Any middle segments between first and second-to-last: joined into Line2 (supports suites, units, etc.)
                      - countryCode defaults to "US"
                    Examples:
                      "200 Spectrum Center Dr, Irvine, CA 92618"
                        -> Line1: "200 Spectrum Center Dr", City: "Irvine"
                      "200 Spectrum Center Dr, Suite 100, Irvine, CA 92618"
                        -> Line1: "200 Spectrum Center Dr", Line2: "Suite 100", City: "Irvine"
                    If parsing fails, return a ValidationError with a
                    descriptive message advising the user to provide a properly
                    formatted address string.
                - field: "items[].origin"
                  from: "CartAddress (single string: address)"
                  to: "TaxCloudAddress (structured: line1, city, state, zip, countryCode)"
                  note: "Same parsing logic as destination"
                - field: "items[].lineItems[].taxabilityCode"
                  from: "taxabilityCode (*int64)"
                  to: "tic (int64, defaults to 0)"
                  note: "Map taxabilityCode to TaxCloud's tic field. If nil, use 0."
                - field: "items[].lineItems[].index"
                  from: "(not present in CalculateCartRequest)"
                  to: "index (int64, required by TaxCloud)"
                  note: "Auto-generate index from the line item's position in the array (0-based)"
                - field: "items[].currency.currencyCode"
                  from: "string (USD)"
                  to: "currencyCode (string, USD)"
                  note: "Pass through as-is. SDK validates USD only since the ZipTax API requires it and CalculateCart uses a shared input contract."
                - field: "transactionDate"
                  from: "(not present in CalculateCartRequest)"
                  to: "transactionDate (optional RFC3339 datetime)"
                  note: "Not included in the transformed request; TaxCloud defaults to now"
          when_false:
            api: "ziptax"
            path: "/calculate/cart"
            http_method: "POST"
            returns:
              type: "*CalculateCartResponse"
              status_code: 200
        parameters: []
        request_body:
          type: "CalculateCartRequest"
          description: "Cart with line items, addresses, and currency for tax calculation. Same input contract regardless of backend routing."
        returns:
          type: "CalculateCartResult"
          description: "Interface type - returns *CalculateCartResponse or *TaxCloudCalculateCartResponse depending on TaxCloud configuration"
          is_array: false
          status_code: 200
          note: "Return type depends on whether TaxCloud is configured. See routing section."
        authentication:
          type: "header"
          header: "X-API-Key"
          format: "{apiKey} or {taxCloudAPIKey}"
          note: "Authentication header is determined by which backend is used. ZipTax uses ZipTax API key; TaxCloud uses TaxCloud API key. Both are already configured on their respective HTTP client instances."
        validation:
          cart:
            - "items array must contain exactly 1 cart element"
            - "currency.currencyCode must be 'USD'"
            - "customerId is required (string)"
            - "destination.address is required (string)"
            - "origin.address is required (string)"
          line_items:
            - "Minimum: 1 line item"
            - "Maximum: 250 line items per cart"
            - "itemId: required (string)"
            - "price: required (positive float64, greater than 0)"
            - "quantity: required (positive float64, greater than 0, supports fractional values)"
            - "taxabilityCode: optional (*int64, mapped to tic for TaxCloud, passed to v60 for ZipTax)"
        tax_calculation:
          formula: "taxAmount = (price x quantity) x taxRate"
          rounding: "5 decimal places for both taxRate and taxAmount (ZipTax); API-determined for TaxCloud"
          note: |
            Tax calculation and origin/destination sourcing resolution are
            performed by the respective API, not by the SDK.
            The SDK sends the cart request and returns the response.
          example: |
            price = 10.75
            quantity = 1.5
            taxRate = 0.09025
            taxAmount = (10.75 x 1.5) x 0.09025 = 1.45528
        errors:
          400:
            - "Invalid request format"
            - "Missing required fields"
            - "Cart exceeds 250 line items"
            - "More than one cart in request"
            - "Address parsing failed (TaxCloud route only)"
          401:
            - "Missing X-API-KEY header"
            - "Invalid or inactive API key"
          403:
            - "Forbidden (TaxCloud only)"
          422:
            - "Unprocessable Entity (TaxCloud only)"
          429:
            - "Too Many Requests (TaxCloud only)"
          500:
            - "Failed to calculate tax rate"
            - "v60 API error (ZipTax only)"
            - "Internal server error"

      # TaxCloud API Orders Endpoints
      - name: "CreateOrder"
        api: "taxcloud"  # Indicates this uses the TaxCloud API
        http_method: "POST"
        path: "/tax/connections/{connectionId}/orders"
        description: "Create orders from marketplace transactions, pre-existing systems, or bulk uploads. Requires TaxCloud Connection ID and API Key configured during client initialization."
        operation_id: "createOrder"
        requires_taxcloud: true  # This endpoint requires TaxCloud credentials
        parameters:
          - name: "connectionId"
            type: "string"
            format: "uuid"
            required: true
            location: "path"
            description: "TaxCloud Connection ID (automatically populated from client configuration)"
            example: "25eb9b97-5acb-492d-b720-c03e79cf715a"
          - name: "addressAutocomplete"
            type: "string"
            required: false
            location: "query"
            description: "The specified addresses will be overridden with first result from address validation search"
            default: "none"
            enum: ["none", "origin", "destination", "all"]
        request_body:
          type: "CreateOrderRequest"
          description: "Order details including line items, addresses, and tax information"
        returns:
          type: "OrderResponse"
          is_array: false
          status_code: 201
        authentication:
          type: "header"
          header: "X-API-KEY"
          format: "{taxCloudAPIKey}"
          note: "Uses TaxCloud API Key configured during client initialization"

      - name: "GetOrder"
        api: "taxcloud"  # Indicates this uses the TaxCloud API
        http_method: "GET"
        path: "/tax/connections/{connectionId}/orders/{orderId}"
        description: "Retrieve a specific order by its ID from TaxCloud. Requires TaxCloud Connection ID and API Key configured during client initialization."
        operation_id: "getOrder"
        requires_taxcloud: true  # This endpoint requires TaxCloud credentials
        parameters:
          - name: "connectionId"
            type: "string"
            format: "uuid"
            required: true
            location: "path"
            description: "TaxCloud Connection ID (automatically populated from client configuration)"
            example: "25eb9b97-5acb-492d-b720-c03e79cf715a"
          - name: "orderId"
            type: "string"
            required: true
            location: "path"
            description: "The ID of the order to retrieve (order ID from external system)"
            example: "my-order-1"
        returns:
          type: "OrderResponse"
          is_array: false
          status_code: 200
        authentication:
          type: "header"
          header: "X-API-KEY"
          format: "{taxCloudAPIKey}"
          note: "Uses TaxCloud API Key configured during client initialization"

      - name: "UpdateOrder"
        api: "taxcloud"  # Indicates this uses the TaxCloud API
        http_method: "PATCH"
        path: "/tax/connections/{connectionId}/orders/{orderId}"
        description: "Update an existing order's completedDate in TaxCloud. Use this endpoint to change when an order was shipped/completed. Requires TaxCloud Connection ID and API Key configured during client initialization."
        operation_id: "updateOrder"
        requires_taxcloud: true  # This endpoint requires TaxCloud credentials
        parameters:
          - name: "connectionId"
            type: "string"
            format: "uuid"
            required: true
            location: "path"
            description: "TaxCloud Connection ID (automatically populated from client configuration)"
            example: "25eb9b97-5acb-492d-b720-c03e79cf715a"
          - name: "orderId"
            type: "string"
            required: true
            location: "path"
            description: "The ID of the order to update (order ID from external system)"
            example: "my-order-1"
        request_body:
          type: "UpdateOrderRequest"
          description: "Update order details (currently only completedDate can be updated)"
        returns:
          type: "OrderResponse"
          is_array: false
          status_code: 200
        authentication:
          type: "header"
          header: "X-API-KEY"
          format: "{taxCloudAPIKey}"
          note: "Uses TaxCloud API Key configured during client initialization"

      # TaxCloud API Refunds Endpoint
      - name: "RefundOrder"
        api: "taxcloud"  # Indicates this uses the TaxCloud API
        http_method: "POST"
        path: "/tax/connections/{connectionId}/orders/refunds/{orderId}"
        description: "Create a refund against an order in TaxCloud. An order can only be refunded once, regardless of whether the order is partially or fully refunded. Requires TaxCloud Connection ID and API Key configured during client initialization."
        operation_id: "refundOrder"
        requires_taxcloud: true  # This endpoint requires TaxCloud credentials
        parameters:
          - name: "connectionId"
            type: "string"
            format: "uuid"
            required: true
            location: "path"
            description: "TaxCloud Connection ID (automatically populated from client configuration)"
            example: "25eb9b97-5acb-492d-b720-c03e79cf715a"
          - name: "orderId"
            type: "string"
            required: true
            location: "path"
            description: "The ID of the order to refund against"
            example: "my-order-1"
        request_body:
          type: "RefundTransactionRequest"
          description: "Refund details including items to refund (empty or omitted items means full refund)"
        returns:
          type: "array"
          items_type: "RefundTransactionResponse"
          is_array: true
          status_code: 201
        authentication:
          type: "header"
          header: "X-API-KEY"
          format: "{taxCloudAPIKey}"
          note: "Uses TaxCloud API Key configured during client initialization"

      # TaxCloud API Cart-to-Order Endpoint
      - name: "CreateOrderFromCart"
        api: "taxcloud"  # Indicates this uses the TaxCloud API
        http_method: "POST"
        path: "/tax/connections/{connectionId}/carts/orders"
        description: |
          Create an order from a previously calculated cart in TaxCloud. This
          converts an existing cart (created via CalculateCart with TaxCloud
          credentials) into a finalized order for tax filing. The user must
          have previously called CalculateCart with TaxCloud credentials and
          stored the returned cartId from that response.

          TaxCloud automatically commits the order at the time of creation,
          finalizing it for tax filing. To set a completed date on the order,
          use UpdateOrder after creation.

          The transactionDate is automatically set by TaxCloud to the moment
          the endpoint is called.

          Requires TaxCloud Connection ID and API Key configured during client
          initialization.
        operation_id: "createOrderFromCart"
        requires_taxcloud: true  # This endpoint requires TaxCloud credentials
        parameters:
          - name: "connectionId"
            type: "string"
            format: "uuid"
            required: true
            location: "path"
            description: "TaxCloud Connection ID (automatically populated from client configuration)"
            example: "25eb9b97-5acb-492d-b720-c03e79cf715a"
        request_body:
          type: "CreateOrderFromCartRequest"
          description: "Cart-to-order conversion details including the cartId from a previous CalculateCart response and the user's internal orderId"
        returns:
          type: "OrderResponse"
          is_array: false
          status_code: 201
        authentication:
          type: "header"
          header: "X-API-KEY"
          format: "{taxCloudAPIKey}"
          note: "Uses TaxCloud API Key configured during client initialization"
        validation:
          request:
            - "cartId is required (non-empty string)"
            - "orderId is required (non-empty string)"
        errors:
          400:
            - "Invalid request format"
            - "Missing required fields (cartId)"
            - "Invalid cartId (cart not found or already converted)"
          401:
            - "Missing X-API-KEY header"
            - "Invalid or inactive API key"
          403:
            - "Forbidden"
          422:
            - "Unprocessable Entity (e.g., cart already converted to order)"
          429:
            - "Too Many Requests"
          500:
            - "Internal server error"

      # -----------------------------------------------------------------------
      # Product Code (TIC) Search Endpoints
      # -----------------------------------------------------------------------
      # These endpoints search for Taxability Information Codes (TICs) using
      # natural language product descriptions. Both use the ZipTax API (not
      # TaxCloud) and require only a ZipTax API key.
      # -----------------------------------------------------------------------

      - name: "SearchProductCodes"
        api: "ziptax"
        http_method: "POST"
        path: "/search/tic"
        description: |
          Search for product codes (TICs) by natural language description.
          Returns all matching Taxability Information Codes ranked and scored
          by relevance.

          Use the returned ticId as the taxabilityCode parameter in rate
          requests or cart line items. For v60 rate requests, pass ticId as
          a string. For cart line items, convert to int64.
        operation_id: "searchProductCodes"
        requires_taxcloud: false
        parameters: []
        request_body:
          type: "ProductCodeSearchRequest"
          content_type: "application/json"
          description: "Search query for product codes"
          schema:
            properties:
              - name: "query"
                type: "string"
                required: true
                description: "Natural language product description (e.g., 'baked goods sold in plastic packaging')"
                validation:
                  min_length: 1
                  max_length: 500
                  note: "Must be non-empty after trimming whitespace and no longer than 500 characters"
        returns:
          type: "ProductCodeSearchResponse"
          is_array: false
          status_code: 200
          description: "Ranked search results with TIC codes, descriptions, and scores"
          schema:
            properties:
              - name: "query"
                type: "string"
                description: "The original search query"
              - name: "results"
                type: "array"
                items_type: "ProductCodeSearchResult"
                description: "Array of matching product codes ranked by relevance"
                item_properties:
                  - name: "ticId"
                    type: "string"
                    description: "Taxability Information Code"
                    example: "41030"
                  - name: "label"
                    type: "string"
                    description: "TIC label from the TIC data"
                    example: "Bakery Items"
                  - name: "naturalLabel"
                    type: "string"
                    description: "Natural language label aligned with the description"
                    example: "Bakery Items"
                  - name: "description"
                    type: "string"
                    description: "Full description of the taxabilityCode line item"
                    example: "Bakery items sold without eating utensils provided by the seller"
                  - name: "documentation"
                    type: "string"
                    description: "Long-form documentation of the TIC code"
                    example: "Bakery items sold without eating utensils provided by the seller, not sold as a prepared food"
                  - name: "rank"
                    type: "string"
                    description: "Itemized rank for the result (1 = best match)"
                    example: "1"
                  - name: "score"
                    type: "string"
                    description: "Confidence score (0.0-1.0), independent of rank"
                    example: "0.891025641025641"
        authentication:
          type: "header"
          header: "X-API-Key"
          format: "{apiKey}"
          note: "Uses ZipTax API Key (no TaxCloud credentials needed)"
        validation:
          request:
            - "query is required (non-empty string after trimming whitespace)"
        errors:
          400:
            - "Invalid request format"
            - "Missing or empty query"
          401:
            - "Missing X-API-Key header"
            - "Invalid or inactive API key"
          429:
            - "Too Many Requests"
          500:
            - "Internal server error"

      - name: "RecommendProductCode"
        api: "ziptax"
        http_method: "POST"
        path: "/search/tic/recommend"
        description: |
          Get an AI-powered product code (TIC) recommendation. Returns a
          single best-match TIC code with higher accuracy than the standard
          search. Has slightly higher latency than SearchProductCodes due
          to the AI processing step.

          Use the returned ticId as the taxabilityCode parameter in rate
          requests or cart line items. For v60 rate requests, pass ticId as
          a string. For cart line items, convert to int64.
        operation_id: "recommendProductCode"
        requires_taxcloud: false
        parameters: []
        request_body:
          type: "ProductCodeSearchRequest"
          content_type: "application/json"
          description: "Search query for AI-powered product code recommendation"
          schema:
            properties:
              - name: "query"
                type: "string"
                required: true
                description: "Natural language product description (e.g., 'baked goods sold in plastic packaging')"
                validation:
                  min_length: 1
                  max_length: 500
                  note: "Must be non-empty after trimming whitespace and no longer than 500 characters"
        returns:
          type: "ProductCodeRecommendationResponse"
          is_array: false
          status_code: 200
          description: "AI-powered product code recommendation"
          schema:
            properties:
              - name: "predictions"
                type: "array"
                items_type: "ProductCodeRecommendation"
                description: "Array of AI-powered product code recommendations (typically one)"
                item_properties:
                  - name: "status"
                    type: "string"
                    description: "Status of the prediction result"
                    enum: ["success", "fail"]
                  - name: "error"
                    type: "string"
                    required: false
                    description: "Non-null error message when the prediction fails"
                  - name: "ticId"
                    type: "string"
                    description: "Recommended Taxability Information Code"
                    example: "41030"
                  - name: "label"
                    type: "string"
                    description: "TIC label from the TIC data"
                    example: "Bakery Items"
                  - name: "naturalLabel"
                    type: "string"
                    description: "Natural language label aligned with the description"
                    example: "Bakery Items"
                  - name: "tic_description"
                    type: "string"
                    description: "Full description of the recommended TIC code"
                    example: "Bakery items sold without eating utensils provided by the seller"
                  - name: "product_description"
                    type: "string"
                    description: "Original product description from the query"
                    example: "baked goods sold in plastic packaging"
        authentication:
          type: "header"
          header: "X-API-Key"
          format: "{apiKey}"
          note: "Uses ZipTax API Key (no TaxCloud credentials needed)"
        validation:
          request:
            - "query is required (non-empty string after trimming whitespace)"
        errors:
          400:
            - "Invalid request format"
            - "Missing or empty query"
          401:
            - "Missing X-API-Key header"
            - "Invalid or inactive API key"
          429:
            - "Too Many Requests"
          500:
            - "Internal server error"

# -----------------------------------------------------------------------------
# Data Models
# -----------------------------------------------------------------------------
# Define the data structures/models used in the API
#
# IMPORTANT IMPLEMENTATION NOTES FOR GO:
# 1. Use Go structs with JSON tags for marshaling/unmarshaling
# 2. API returns camelCase fields - use json tags to map to Go's PascalCase fields
# 3. Many fields are OPTIONAL in real responses - use pointers (*string, *float64) for optional fields
# 4. Jurisdiction names (jurName) contain actual values like "CA", "ORANGE" - NOT enums
# 5. Use float64 for decimal/float values, int64 for integers, string for strings
# 6. Use omitempty tag for optional fields: `json:"fieldName,omitempty"`
# 7. Add JSON validation tags or use custom UnmarshalJSON when needed
# 8. See "actual_api_responses" section below for real response structures
models:
  # ---------------------------------------------------------------------------
  # API Version 6.0 Models (Latest)
  # ---------------------------------------------------------------------------
  - name: "V60Response"
    description: "Response for v6.0 API - structured format with separate components"
    properties:
      - name: "metadata"
        type: "V60Metadata"
        required: true
        description: "Response metadata"
      - name: "base_rates"
        type: "array"
        items_type: "V60BaseRate"
        required: false  # Can be null/missing
        api_field: "baseRates"  # API uses camelCase
        description: "Base tax rates by jurisdiction"
      - name: "service"
        type: "V60Service"
        required: true
        description: "Service taxability information"
      - name: "shipping"
        type: "V60Shipping"
        required: true
        description: "Shipping taxability information"
      - name: "sourcing_rules"
        type: "V60SourcingRules"
        required: false  # Can be null/missing
        api_field: "sourcingRules"  # IMPORTANT: API field is 'sourcingRules' not 'originDestination'
        description: "Sourcing rules (origin vs destination)"
      - name: "tax_summaries"
        type: "array"
        items_type: "V60TaxSummary"
        required: false  # Can be null/missing
        api_field: "taxSummaries"  # API uses camelCase
        description: "Tax rate summaries"
      - name: "addressDetail"
        type: "V60AddressDetail"
        required: true
        api_field: "addressDetail"  # API keeps this as camelCase (no snake_case conversion)
        description: "Address details"

  - name: "V60Metadata"
    description: "Metadata for v6.0 response"
    properties:
      - name: "version"
        type: "string"
        required: true
        description: "API version"
        example: "v60"
      - name: "response"
        type: "V60ResponseInfo"
        required: true
        description: "Response information (NESTED OBJECT - not flat)"

  - name: "V60ResponseInfo"
    description: "Response information nested in metadata"
    properties:
      - name: "code"
        type: "integer"
        format: "int64"
        required: true
        description: "Response code (100=success)"
        example: 100
      - name: "name"
        type: "string"
        required: true
        description: "Response code name"
        example: "RESPONSE_CODE_SUCCESS"
      - name: "message"
        type: "string"
        required: true
        description: "Response message"
        example: "Successful API Request."
      - name: "definition"
        type: "string"
        required: true
        description: "Schema definition URL"
        example: "http://api.zip-tax.com/request/v60/schema"

  - name: "V60BaseRate"
    description: "Base tax rate for a specific jurisdiction"
    properties:
      - name: "rate"
        type: "number"
        format: "float"
        required: true
        description: "Tax rate (decimal format, e.g., 0.0775 for 7.75%)"
      - name: "rate_id"
        type: "string"
        required: false  # OPTIONAL in real API responses
        api_field: "rateId"  # API uses camelCase
        description: "Rate identifier from tax table"
      - name: "jur_type"
        type: "string"  # STRING not enum - API may return various types
        required: true
        api_field: "jurType"  # API uses camelCase
        description: "Jurisdiction type (e.g., US_STATE_SALES_TAX, US_COUNTY_SALES_TAX)"
        example: "US_STATE_SALES_TAX"
      - name: "jur_name"
        type: "string"  # STRING not enum - contains actual names like "CA", "ORANGE"
        required: true
        api_field: "jurName"  # API uses camelCase
        description: "Actual jurisdiction name (e.g., 'CA', 'ORANGE', 'IRVINE')"
        example: "CA"
      - name: "jur_description"
        type: "string"
        required: false  # OPTIONAL in real API responses
        api_field: "jurDescription"  # API uses camelCase
        description: "Human-readable jurisdiction description"
        example: "US State Sales Tax"
      - name: "jur_tax_code"
        type: "string"
        required: false  # OPTIONAL in real API responses
        api_field: "jurTaxCode"  # API uses camelCase
        description: "Tax code for jurisdiction"
        example: "06"

  - name: "V60Service"
    description: "Service taxability information"
    properties:
      - name: "adjustment_type"
        type: "string"
        required: true
        api_field: "adjustmentType"  # API uses camelCase
        description: "Service adjustment type"
        example: "SERVICE_TAXABLE"
      - name: "taxable"
        type: "string"
        required: true
        description: "Taxability indicator"
        enum: ["Y", "N"]
      - name: "description"
        type: "string"
        required: true
        description: "Service description"

  - name: "V60Shipping"
    description: "Shipping taxability information"
    properties:
      - name: "adjustment_type"
        type: "string"
        required: true
        api_field: "adjustmentType"  # API uses camelCase
        description: "Shipping adjustment type"
        example: "FREIGHT_TAXABLE"
      - name: "taxable"
        type: "string"
        required: true
        description: "Taxability indicator"
        enum: ["Y", "N"]
      - name: "description"
        type: "string"
        required: true
        description: "Shipping description"

  - name: "V60SourcingRules"
    description: "Sourcing rules (origin vs destination) - API field is 'sourcingRules'"
    api_field: "sourcingRules"  # IMPORTANT: Not 'originDestination'
    properties:
      - name: "adjustment_type"
        type: "string"
        required: true
        api_field: "adjustmentType"  # API uses camelCase
        description: "Sourcing rules type"
        example: "ORIGIN_DESTINATION"
      - name: "description"
        type: "string"
        required: true
        description: "Sourcing rules description"
        example: "Destination Based Taxation"
      - name: "value"
        type: "string"
        required: true
        description: "Origin/destination indicator"
        enum: ["O", "D"]

  - name: "V60TaxSummary"
    description: "Tax rate summary"
    properties:
      - name: "rate"
        type: "number"
        format: "float"
        required: true
        description: "Summary tax rate"
      - name: "tax_type"
        type: "string"  # STRING not strict enum
        required: true
        api_field: "taxType"  # API uses camelCase
        description: "Tax type (e.g., SALES_TAX, USE_TAX)"
        example: "SALES_TAX"
      - name: "summary_name"
        type: "string"
        required: true
        api_field: "summaryName"  # API uses camelCase
        description: "Summary description"
        example: "Total Base Sales Tax"
      - name: "display_rates"
        type: "array"
        items_type: "V60DisplayRate"
        required: true
        api_field: "displayRates"  # API uses camelCase
        description: "Array of display rate breakdowns"

  - name: "V60DisplayRate"
    description: "Display rate breakdown within tax summary"
    properties:
      - name: "name"
        type: "string"
        required: true
        description: "Display rate name"
        example: "Total Rate"
      - name: "rate"
        type: "number"
        format: "float"
        required: true
        description: "Display rate value"
        example: 0.0775

  - name: "V60AddressDetail"
    description: "Address detail information for v6.0"
    properties:
      - name: "normalizedAddress"
        type: "string"
        required: true
        description: "Normalized address"
      - name: "incorporated"
        type: "string"
        required: true
        description: "Incorporation status"
        enum: ["true", "false"]
      - name: "geoLat"
