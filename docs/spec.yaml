  # ---------------------------------------------------------------------------
  # ZipTax Cart Tax Calculation Models
  # ---------------------------------------------------------------------------
  - name: "CalculateCartRequest"
    description: "Request payload for calculating sales tax on a shopping cart. Wraps a single cart item in an 'items' array."
    api: "ziptax"
    properties:
      - name: "items"
        type: "array"
        items_type: "CartItem"
        required: true
        description: "Array of cart items (must contain exactly 1 element)"
        validation:
          min_items: 1
          max_items: 1

  - name: "CartItem"
    description: "A single cart containing customer info, addresses, currency, and line items for tax calculation"
    api: "ziptax"
    properties:
      - name: "customerId"
        type: "string"
        required: true
        description: "Customer identifier"
        example: "customer-453"
      - name: "currency"
        type: "CartCurrency"
        required: true
        description: "Currency information (must be USD)"
      - name: "destination"
        type: "CartAddress"
        required: true
        description: "Destination address used for tax calculation"
      - name: "origin"
        type: "CartAddress"
        required: true
        description: "Origin address of the seller/shipper"
      - name: "lineItems"
        type: "array"
        items_type: "CartLineItem"
        required: true
        description: "Array of line items in the cart (1-250 items)"
        validation:
          min_items: 1
          max_items: 250

  - name: "CartAddress"
    description: "Simple address structure for cart tax calculation (single string format)"
    api: "ziptax"
    properties:
      - name: "address"
        type: "string"
        required: true
        description: "Full address string for geocoding"
        example: "200 Spectrum Center Dr, Irvine, CA 92618-1905"

  - name: "CartCurrency"
    description: "Currency information for cart request"
    api: "ziptax"
    properties:
      - name: "currencyCode"
        type: "string"
        required: true
        description: "ISO currency code (must be USD)"
        enum: ["USD"]
        example: "USD"

  - name: "CartLineItem"
    description: "A line item in the cart request with product details for tax calculation"
    api: "ziptax"
    properties:
      - name: "itemId"
        type: "string"
        required: true
        description: "Unique identifier for the line item"
        example: "item-1"
      - name: "price"
        type: "number"
        format: "float64"
        required: true
        description: "Unit price of the item (must be positive, greater than 0)"
        example: 10.75
        validation:
          exclusive_minimum: 0
      - name: "quantity"
        type: "number"
        format: "float64"
        required: true
        description: "Quantity of the item (must be positive, greater than 0, supports fractional values for items sold by weight)"
        example: 1.5
        validation:
          exclusive_minimum: 0
      - name: "taxabilityCode"
        type: "integer"
        format: "int64"
        required: false
        description: "Taxability code for product-specific tax rules (passed to v60 tax engine if provided). Use pointer (*int64) in Go struct."
        example: 0

  - name: "CalculateCartResponse"
    description: "Response from ZipTax cart tax calculation containing per-item tax details"
    api: "ziptax"
    notes: "Implements CalculateCartResult interface"
    properties:
      - name: "items"
        type: "array"
        items_type: "CartItemResponse"
        required: true
        description: "Array of cart results (mirrors request items array order)"

  - name: "CartItemResponse"
    description: "A single cart response with calculated tax information per line item"
    api: "ziptax"
    properties:
      - name: "cartId"
        type: "string"
        format: "uuid"
        required: true
        description: "Server-generated UUID identifying this cart calculation"
        example: "ce4a...ccefdd"
      - name: "customerId"
        type: "string"
        required: true
        description: "Customer identifier (echoed from request)"
        example: "customer-453"
      - name: "destination"
        type: "CartAddress"
        required: true
        description: "Destination address (echoed from request)"
      - name: "origin"
        type: "CartAddress"
        required: true
        description: "Origin address (echoed from request)"
      - name: "lineItems"
        type: "array"
        items_type: "CartLineItemResponse"
        required: true
        description: "Array of line items with calculated tax information"

  - name: "CartLineItemResponse"
    description: "A line item in the cart response with calculated tax rate and amount"
    api: "ziptax"
    properties:
      - name: "itemId"
        type: "string"
        required: true
        description: "Unique identifier for the line item (echoed from request)"
        example: "item-1"
      - name: "price"
        type: "number"
        format: "float64"
        required: true
        description: "Unit price of the item (echoed from request)"
        example: 10.75
      - name: "quantity"
        type: "number"
        format: "float64"
        required: true
        description: "Quantity of the item (echoed from request)"
        example: 1.5
      - name: "tax"
        type: "CartTax"
        required: true
        description: "Calculated tax information for this line item"

  - name: "CartTax"
    description: "Calculated tax details for a cart line item"
    api: "ziptax"
    properties:
      - name: "rate"
        type: "number"
        format: "float64"
        required: true
        description: "Calculated sales tax rate (rounded to 5 decimal places)"
        example: 0.09025
      - name: "amount"
        type: "number"
        format: "float64"
        required: true
        description: "Calculated tax amount: (price x quantity) x rate (rounded to 5 decimal places)"
        example: 1.45528

  # ---------------------------------------------------------------------------
  # TaxCloud Cart Tax Calculation Models
  # ---------------------------------------------------------------------------
  # These models are used when CalculateCart routes to TaxCloud API.
  # The SDK transforms the shared CalculateCartRequest into the TaxCloud
  # request format internally, but these models define the TaxCloud
  # response structure returned to the caller.
  # ---------------------------------------------------------------------------

  - name: "TaxCloudCalculateCartResponse"
    description: |
      Response from TaxCloud cart tax calculation. Returned by CalculateCart
      when the client is configured with TaxCloud credentials. Contains the
      connectionId, transactionDate, and an array of cart results with
      TaxCloud-style structured addresses and line items with tax details.
      Implements CalculateCartResult interface.
    api: "taxcloud"
    properties:
      - name: "connectionId"
        type: "string"
        required: true
        description: "TaxCloud Connection ID used for this cart calculation"
        example: "25eb9b97-5acb-492d-b720-c03e79cf715a"
      - name: "items"
        type: "array"
        items_type: "TaxCloudCartItemResponse"
        required: true
        description: "Array of cart results with calculated tax information"
      - name: "transactionDate"
        type: "string"
        format: "date-time"
        required: true
        description: "RFC3339 datetime string the cart was calculated for"
        example: "2024-01-15T09:30:00Z"

  - name: "TaxCloudCartItemResponse"
    description: "A single cart response from TaxCloud with calculated tax information per line item"
    api: "taxcloud"
    properties:
      - name: "cartId"
        type: "string"
        required: true
        description: "ID representing this cart. Auto-generated if not provided in the request."
        example: "ce4a1234-5678-90ab-cdef-1234567890ab"
      - name: "customerId"
        type: "string"
        required: true
        description: "Customer identifier (echoed from request)"
        example: "customer-453"
      - name: "currency"
        type: "CurrencyResponse"
        required: true
        description: "Currency information"
      - name: "deliveredBySeller"
        type: "boolean"
        required: true
        description: "Whether the seller directly delivered the order"
      - name: "destination"
        type: "TaxCloudAddressResponse"
        required: true
        description: "Destination address (structured format from TaxCloud)"
      - name: "origin"
        type: "TaxCloudAddressResponse"
        required: true
        description: "Origin address (structured format from TaxCloud)"
      - name: "exemption"
        type: "Exemption"
        required: true
        description: "Exemption information"
      - name: "lineItems"
        type: "array"
        items_type: "TaxCloudCartLineItemResponse"
        required: true
        description: "Array of line items with calculated tax information"

  - name: "TaxCloudCartLineItemResponse"
    description: "A line item in the TaxCloud cart response with calculated tax rate and amount"
    api: "taxcloud"
    properties:
      - name: "index"
        type: "integer"
        format: "int64"
        required: true
        description: "Position/index of item within the cart (0-based)"
        example: 0
      - name: "itemId"
        type: "string"
        required: true
        description: "Unique identifier for the line item (echoed from request)"
        example: "item-1"
      - name: "price"
        type: "number"
        format: "float64"
        required: true
        description: "Unit price of the item (echoed from request)"
        example: 10.8
      - name: "quantity"
        type: "number"
        format: "float64"
        required: true
        description: "Quantity of the item (echoed from request)"
        example: 1.5
      - name: "tax"
        type: "Tax"
        required: true
        description: "Calculated tax information for this line item (uses existing TaxCloud Tax model)"
      - name: "tic"
        type: "integer"
        format: "int64"
        required: false
        description: "Taxability Information Code (mapped from taxabilityCode, defaults to 0). Nullable in API response - use *int64 in Go struct."
        example: 0

  # ---------------------------------------------------------------------------
  # TaxCloud API Models - Order Management
  # ---------------------------------------------------------------------------
  - name: "CreateOrderRequest"
    description: "Request payload for creating an order in TaxCloud"
    api: "taxcloud"
    properties:
      - name: "orderId"
        type: "string"
        required: true
        description: "Order ID in external system"
        example: "my-order-1"
      - name: "customerId"
        type: "string"
        required: true
        description: "Customer ID in external system"
        example: "customer-453"
      - name: "transactionDate"
        type: "string"
        format: "date-time"
        required: true
        description: "RFC3339 datetime string when order was purchased"
        example: "2024-01-15T09:30:00Z"
      - name: "completedDate"
        type: "string"
        format: "date-time"
        required: true
        description: "RFC3339 datetime string when order was shipped/completed (created tax liability)"
        example: "2024-01-15T09:30:00Z"
      - name: "origin"
        type: "TaxCloudAddress"
        required: true
        description: "Origin address of the order"
      - name: "destination"
        type: "TaxCloudAddress"
        required: true
        description: "Destination address of the order"
      - name: "lineItems"
        type: "array"
        items_type: "CartItemWithTax"
        required: true
        description: "Array of line items in the order with tax calculations"
      - name: "currency"
        type: "Currency"
        required: true
        description: "Currency information for the order"
      - name: "channel"
        type: "string"
        required: false
        description: "Sales channel (e.g., amazon, ebay, walmart) for tax exclusion rules"
        example: "amazon"
      - name: "deliveredBySeller"
        type: "boolean"
        required: false
        description: "Whether the seller directly delivered the order"
      - name: "excludeFromFiling"
        type: "boolean"
        required: false
        description: "Whether to exclude this order from tax filing"
        default: false
      - name: "exemption"
        type: "Exemption"
        required: false
        description: "Exemption certificate information for the order"

  - name: "OrderResponse"
    description: "Response after successfully creating an order in TaxCloud"
    api: "taxcloud"
    properties:
      - name: "orderId"
        type: "string"
        required: true
        description: "Order ID in external system"
      - name: "customerId"
        type: "string"
        required: true
        description: "Customer ID in external system"
      - name: "connectionId"
        type: "string"
        required: true
        description: "TaxCloud connection ID used for this order"
      - name: "transactionDate"
        type: "string"
        format: "date-time"
        required: true
        description: "RFC3339 datetime string when order was purchased"
      - name: "completedDate"
        type: "string"
        format: "date-time"
        required: true
        description: "RFC3339 datetime string when order was shipped/completed"
      - name: "origin"
        type: "TaxCloudAddressResponse"
        required: true
        description: "Origin address of the order"
      - name: "destination"
        type: "TaxCloudAddressResponse"
        required: true
        description: "Destination address of the order"
      - name: "lineItems"
        type: "array"
        items_type: "CartItemWithTaxResponse"
        required: true
        description: "Array of line items with tax calculations"
      - name: "currency"
        type: "CurrencyResponse"
        required: true
        description: "Currency information"
      - name: "channel"
        type: "string"
        required: true
        description: "Sales channel for the order"
      - name: "deliveredBySeller"
        type: "boolean"
        required: true
        description: "Whether seller directly delivered the order"
      - name: "excludeFromFiling"
        type: "boolean"
        required: true
        default: false
        description: "Whether order is excluded from tax filing"
      - name: "exemption"
        type: "Exemption"
        required: true
        description: "Exemption information"

  - name: "TaxCloudAddress"
    description: "Address structure for TaxCloud orders"
    api: "taxcloud"
    properties:
      - name: "line1"
        type: "string"
        required: true
        description: "First line of address (street, PO Box, or building)"
        example: "323 Washington Ave N"
      - name: "line2"
        type: "string"
        required: false
        description: "Second line of address (apartment or suite number)"
      - name: "city"
        type: "string"
        required: true
        description: "City or post-town"
        example: "Minneapolis"
      - name: "state"
        type: "string"
        required: true
        description: "State, province, county or large territorial division"
        example: "MN"
      - name: "zip"
        type: "string"
        required: true
        description: "Postal or ZIP code"
        example: "55401-2427"
      - name: "countryCode"
        type: "string"
        required: false
        description: "ISO 3166-1 alpha-2 country code"
        default: "US"
        enum: ["US", "CA"]

  - name: "TaxCloudAddressResponse"
    description: "Address response structure from TaxCloud"
    api: "taxcloud"
    properties:
      - name: "line1"
        type: "string"
        required: true
        description: "First line of address"
      - name: "line2"
        type: "string"
        required: false
        description: "Second line of address"
      - name: "city"
        type: "string"
        required: true
        description: "City or post-town"
      - name: "state"
        type: "string"
        required: true
        description: "State abbreviation"
      - name: "zip"
        type: "string"
        required: true
        description: "Postal or ZIP code"
      - name: "countryCode"
        type: "string"
        required: true
        default: "US"
        description: "ISO 3166-1 alpha-2 country code"

  - name: "CartItemWithTax"
    description: "Cart line item with tax calculation for order creation"
    api: "taxcloud"
    properties:
      - name: "index"
        type: "integer"
        format: "int64"
        required: true
        description: "Position/index of item within the cart"
        example: 0
      - name: "itemId"
        type: "string"
        required: true
        description: "Unique identifier for the cart item"
        example: "item-1"
      - name: "price"
        type: "number"
        format: "float"
        required: true
        description: "Unit price of the item"
        example: 10.8
      - name: "quantity"
        type: "number"
        format: "float"
        required: true
        description: "Quantity of the item"
        example: 1.5
      - name: "tax"
        type: "Tax"
        required: true
        description: "Tax information for the item"
      - name: "productId"
        type: "string"
        required: false
        description: "Product ID from product catalog (must match existing product)"
      - name: "tic"
        type: "integer"
        format: "int64"
        required: false
        description: "Taxability Information Code (defaults to 0 if not provided)"
        default: 0

  - name: "CartItemWithTaxResponse"
    description: "Cart line item response from TaxCloud"
    api: "taxcloud"
    properties:
      - name: "index"
        type: "integer"
        format: "int64"
        required: true
        description: "Position/index of item within the cart"
      - name: "itemId"
        type: "string"
        required: true
        description: "Unique identifier for the cart item"
      - name: "price"
        type: "number"
        format: "float"
        required: true
        description: "Unit price of the item"
      - name: "quantity"
        type: "number"
        format: "float"
        required: true
        description: "Quantity of the item"
      - name: "tax"
        type: "Tax"
        required: true
        description: "Tax information for the item"
      - name: "tic"
        type: "integer"
        format: "int64"
        required: true
        description: "Taxability Information Code"

  - name: "Tax"
    description: "Tax calculation details for a cart item"
    api: "taxcloud"
    properties:
      - name: "amount"
        type: "number"
        format: "float"
        required: true
        description: "Tax amount calculated for the item"
        example: 1.31
      - name: "rate"
        type: "number"
        format: "float"
        required: true
        description: "Tax rate applied (decimal format)"
        example: 0.0813

  - name: "Currency"
    description: "Currency information for order"
    api: "taxcloud"
    properties:
      - name: "currencyCode"
        type: "string"
        required: false
        description: "ISO currency code"
        default: "USD"
        enum: ["USD", "CAD"]

  - name: "CurrencyResponse"
    description: "Currency response from TaxCloud"
    api: "taxcloud"
    properties:
      - name: "currencyCode"
        type: "string"
        required: true
        description: "ISO currency code"

  - name: "Exemption"
    description: "Tax exemption certificate information"
    api: "taxcloud"
    properties:
      - name: "exemptionId"
        type: "string"
        required: false
        description: "ID of exemption certificate used for customer (if provided, isExempt assumed true)"
      - name: "isExempt"
        type: "boolean"
        required: false
        description: "Whether customer is exempt from tax"

  - name: "UpdateOrderRequest"
    description: "Request payload for updating an order in TaxCloud (currently only completedDate can be updated)"
    api: "taxcloud"
    properties:
      - name: "completedDate"
        type: "string"
        format: "date-time"
        required: true
        description: "RFC3339 datetime string when order was shipped/completed (creates tax liability)"
        example: "2024-01-16T10:00:00Z"

  # ---------------------------------------------------------------------------
  # TaxCloud API Models - Cart-to-Order
  # ---------------------------------------------------------------------------
  - name: "CreateOrderFromCartRequest"
    description: |
      Request payload for creating an order from a previously calculated cart
      in TaxCloud. The user must have previously called CalculateCart with
      TaxCloud credentials and stored the returned cartId from the
      TaxCloudCartItemResponse. The orderId represents the user's internal
      order identifier for cross-referencing. To set a completed date on
      the order, use UpdateOrder after creation.
    api: "taxcloud"
    properties:
      - name: "cartId"
        type: "string"
        required: true
        description: "Cart ID from a previous TaxCloud CalculateCart response (TaxCloudCartItemResponse.CartId). Identifies the cart to convert into an order."
        example: "ce4a1234-5678-90ab-cdef-1234567890ab"
        validation:
          min_length: 1
      - name: "orderId"
        type: "string"
        required: true
        description: "User's internal order ID for cross-referencing. Must be unique per connection to ensure accurate tax reporting and prevent duplicate transactions."
        example: "my-order-1"
        validation:
          min_length: 1

  # ---------------------------------------------------------------------------
  # TaxCloud API Models - Refunds
  # ---------------------------------------------------------------------------
  - name: "RefundTransactionRequest"
    description: "Request payload for creating a refund against an order in TaxCloud"
    api: "taxcloud"
    properties:
      - name: "items"
        type: "array"
        items_type: "CartItemRefundWithTaxRequest"
        required: false
        description: "Items to refund. If empty list or omitted, entire order will be refunded"
      - name: "returnedDate"
        type: "string"
        format: "date-time"
        required: false
        description: "Include only if this return is a change to a previously filed sales tax return (triggers Amended Sales Tax Return - not typically recommended)"

  - name: "CartItemRefundWithTaxRequest"
    description: "Cart line item to be refunded"
    api: "taxcloud"
    properties:
      - name: "itemId"
        type: "string"
        required: true
        description: "Unique identifier for the cart item to refund"
        example: "item-1"
      - name: "quantity"
        type: "number"
        format: "float"
        required: true
        description: "Quantity of the item to refund"
        example: 1.0

  - name: "RefundTransactionResponse"
    description: "Response after successfully creating a refund in TaxCloud"
    api: "taxcloud"
    properties:
      - name: "connectionId"
        type: "string"
        required: true
        description: "TaxCloud connection ID used for this refund"
      - name: "createdDate"
        type: "string"
        format: "date-time"
        required: true
        description: "RFC3339 datetime string when the refund was created"
      - name: "items"
        type: "array"
        items_type: "CartItemRefundWithTaxResponse"
        required: true
        description: "Array of refunded line items with tax calculations"
      - name: "returnedDate"
        type: "string"
        format: "date-time"
        required: false
        description: "RFC3339 datetime string when the refund took effect"

  - name: "CartItemRefundWithTaxResponse"
    description: "Refunded cart line item response from TaxCloud"
    api: "taxcloud"
    properties:
      - name: "index"
        type: "integer"
        format: "int64"
        required: true
        description: "Position/index of item within the cart"
      - name: "itemId"
        type: "string"
        required: true
        description: "Unique identifier for the cart item"
      - name: "price"
        type: "number"
        format: "float"
        required: true
        description: "Price of the refunded item"
      - name: "quantity"
        type: "number"
        format: "float"
        required: true
        description: "Quantity of the item refunded"
      - name: "tax"
        type: "RefundTax"
        required: true
        description: "Tax information for the refunded item"
      - name: "tic"
        type: "integer"
        format: "int64"
        required: false
        default: 0
        description: "Taxability Information Code"

  - name: "RefundTax"
    description: "Tax details for a refunded item"
    api: "taxcloud"
    properties:
      - name: "amount"
        type: "number"
        format: "float"
        required: true
        description: "Tax amount refunded for the item"
        example: 1.31

  # ---------------------------------------------------------------------------
  # Product Code (TIC) Search Models
  # ---------------------------------------------------------------------------

  - name: "ProductCodeSearchRequest"
    description: "Request payload for product code search and recommendation endpoints"
    properties:
      - name: "query"
        type: "string"
        required: true
        api_field: "query"
        description: "Natural language product description to search for matching TIC codes"
        example: "baked goods sold in plastic packaging"

  - name: "ProductCodeSearchResult"
    description: "A single product code search result with TIC code, description, rank, and score"
    properties:
      - name: "ticId"
        type: "string"
        required: true
        api_field: "ticId"
        description: "Taxability Information Code"
        example: "41030"
      - name: "label"
        type: "string"
        required: true
        api_field: "label"
        description: "TIC label from the TIC data"
        example: "Bakery Items"
      - name: "naturalLabel"
        type: "string"
        required: true
        api_field: "naturalLabel"
        description: "Natural language label aligned with the full description"
        example: "Bakery Items"
      - name: "description"
        type: "string"
        required: true
        api_field: "description"
        description: "Full description of the taxabilityCode line item"
        example: "Bakery items sold without eating utensils provided by the seller"
      - name: "documentation"
        type: "string"
        required: true
        api_field: "documentation"
        description: "Long-form documentation of the TIC code"
        example: "Bakery items sold without eating utensils provided by the seller, not sold as a prepared food"
      - name: "rank"
        type: "string"
        required: true
        api_field: "rank"
        description: "Itemized rank for the result (1 = best match)"
        example: "1"
      - name: "score"
        type: "string"
        required: true
        api_field: "score"
        description: "Confidence score (0.0-1.0), independent of rank"
        example: "0.891025641025641"

  - name: "ProductCodeSearchResponse"
    description: "Response from the product code search endpoint"
    properties:
      - name: "query"
        type: "string"
        required: true
        api_field: "query"
        description: "The original search query"
      - name: "results"
        type: "array"
        items_type: "ProductCodeSearchResult"
        required: true
        api_field: "results"
        description: "Array of matching product codes ranked by relevance"

  - name: "ProductCodeRecommendation"
    description: "A single AI-powered product code recommendation"
    properties:
      - name: "status"
        type: "string"
        required: true
        api_field: "status"
        description: "Status of the prediction result (success or fail)"
        enum: ["success", "fail"]
      - name: "error"
        type: "string"
        required: false
        api_field: "error"
        description: "Non-null error message when the prediction fails"
      - name: "ticId"
        type: "string"
        required: true
        api_field: "ticId"
        description: "Recommended Taxability Information Code"
        example: "41030"
      - name: "label"
        type: "string"
        required: true
        api_field: "label"
        description: "TIC label from the TIC data"
        example: "Bakery Items"
      - name: "naturalLabel"
        type: "string"
        required: true
        api_field: "naturalLabel"
        description: "Natural language label aligned with the description"
        example: "Bakery Items"
      - name: "ticDescription"
        type: "string"
        required: true
        api_field: "tic_description"
        description: "Full description of the recommended TIC code"
        example: "Bakery items sold without eating utensils provided by the seller"
      - name: "productDescription"
        type: "string"
        required: true
        api_field: "product_description"
        description: "Original product description from the query"
        example: "baked goods sold in plastic packaging"

  - name: "ProductCodeRecommendationResponse"
    description: "Response from the product code recommendation endpoint"
    properties:
      - name: "predictions"
        type: "array"
        items_type: "ProductCodeRecommendation"
        required: true
        api_field: "predictions"
        description: "Array of AI-powered product code recommendations (typically one)"


# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
dependencies:
  # Runtime dependencies (Go modules)
  # Note: Go standard library provides net/http, encoding/json, etc.
  runtime:
    - name: "stdlib:net/http"
      purpose: "HTTP client functionality (built into Go)"
      note: "No external dependency required"
    - name: "stdlib:encoding/json"
      purpose: "JSON marshaling/unmarshaling (built into Go)"
      note: "No external dependency required"
    - name: "stdlib:context"
      purpose: "Context for cancellation and timeouts (built into Go)"
      note: "No external dependency required"
    - name: "github.com/go-playground/validator/v10"
      version: ">=10.0.0"
      purpose: "Struct validation (optional, if needed)"
      required: false

  # Development dependencies (Go tools)
  development:
    - name: "golang.org/x/tools/cmd/goimports"
      purpose: "Import management and formatting"
    - name: "github.com/golangci/golangci-lint"
      version: ">=1.55.0"
      purpose: "Comprehensive linting (includes staticcheck, gosec, etc.)"
    - name: "github.com/stretchr/testify"
      version: ">=1.8.0"
      purpose: "Testing assertions and mocks"

# -----------------------------------------------------------------------------
# Project Structure
# -----------------------------------------------------------------------------
# Define the directory structure for the SDK (Go module layout)
structure:
  root_files:
    - "README.md"
    - "LICENSE"
    - ".gitignore"
    - "go.mod"              # Go module definition
    - "go.sum"              # Go dependency checksums
    - "Makefile"            # Build automation (optional but recommended)

  directories:
    # Main package directory (root level - typical Go layout)
    - path: "."
      contents:
        - "client.go"         # Main client implementation
        - "config.go"         # Configuration options
        - "errors.go"         # Error definitions and sentinel errors
        - "options.go"        # Option types for functional options pattern

    # Models package for request/response structures
    - path: "models"
      contents:
        - "v60_response.go"   # V60 API models
        - "v60_metadata.go"   # V60 metadata models
        - "v60_rates.go"      # V60 rate models
        - "account.go"        # Account metrics models

    # Internal utilities (not exported)
    - path: "internal/http"
      contents:
        - "client.go"         # HTTP client wrapper
        - "retry.go"          # Retry logic with exponential backoff
        - "middleware.go"     # Request/response middleware

    - path: "internal/validation"
      contents:
        - "validator.go"      # Input validation utilities

    # Test files (co-located with implementation using _test.go suffix)
    - path: "."
      contents:
        - "client_test.go"    # Tests for client
        - "errors_test.go"    # Tests for error handling

    - path: "internal/http"
      contents:
        - "client_test.go"    # REQUIRED: Tests for HTTP client
        - "retry_test.go"     # REQUIRED: Tests for retry logic

    # Examples directory
    - path: "examples"
      contents:
        - "basic_usage"       # Directory with main.go for basic usage
        - "concurrent_usage"  # Directory with main.go for concurrent operations
        - "error_handling"    # Directory with main.go for error handling

    # Documentation directory
    - path: "docs"
      contents:
        - "index.md"
        - "quickstart.md"
        - "api-reference.md"

# -----------------------------------------------------------------------------
# Code Generation Settings
# -----------------------------------------------------------------------------
code_generation:
  # Style guide compliance
  style:
    follow_language_conventions: true
    style_guide: "Effective Go + Go Code Review Comments"
    formatting_tool: "gofmt"            # Standard Go formatter
    import_tool: "goimports"            # Import organization
    line_length: 120                    # Go community standard (soft limit)
    indent_style: "tabs"                # Go standard is tabs

  # Documentation
  documentation:
    style: "godoc"                      # Standard Go documentation format
    include_examples: true              # Include example functions (Example*)
    include_type_info: true             # Type information in comments
    minimum_coverage: "public_api"      # Document all exported symbols
    format: |
      // FunctionName does something useful.
      //
      // It takes parameters and returns results.
      // Multiple paragraphs are separated by blank comment lines.
      //
      // Example:
      //
      //     client := ziptax.NewClient(apiKey)
      //     response, err := client.GetSalesTaxByAddress(ctx, address)

  # Testing
  testing:
    framework: "testing"                # Go standard testing package
    include_unit_tests: true
    include_integration_tests: true
    mock_api_responses: true
    use_testify: true                   # Use testify for assertions
    use_table_tests: true               # Use table-driven tests pattern
    target_coverage: 80

  # Code quality
  quality:
    include_linter_config: true         # .golangci.yml configuration
    include_formatter_config: false     # gofmt is standard, no config needed
    include_makefile: true              # Build automation
    include_pre_commit_hooks: true      # Git hooks for quality checks

# -----------------------------------------------------------------------------
# Build & Distribution
# -----------------------------------------------------------------------------
build:
  # Build system
  system: "go_modules"                  # Go modules (go.mod)
  go_version: "1.21"                    # Minimum Go version

  # Build commands
  commands:
    test: "go test ./..."
    test_verbose: "go test -v ./..."
    test_coverage: "go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out"
    build: "go build ./..."
    lint: "golangci-lint run"
    fmt: "gofmt -s -w ."
    imports: "goimports -w ."

  # Distribution
  distribution:
    platforms:
      - "pkg.go.dev"                    # Go package registry (automatic)
      - "github"                        # GitHub releases for versioning

    # Go module metadata (in go.mod)
    module_path: "github.com/ziptax/ziptax-go"

    # Release artifacts (optional binaries)
    artifacts:
      - platform: "linux/amd64"
      - platform: "linux/arm64"
      - platform: "darwin/amd64"
      - platform: "darwin/arm64"
      - platform: "windows/amd64"

    # Tags and versioning
    versioning:
      scheme: "semver"                  # Semantic versioning
      tag_format: "v{version}"          # e.g., v1.0.0

    keywords:
      - "tax"
      - "ziptax"
      - "api"
      - "sdk"
      - "sales-tax"
      - "golang"

# -----------------------------------------------------------------------------
# Documentation
# -----------------------------------------------------------------------------
documentation:
  # Documentation tools
  generator: "godoc"                    # Go's native documentation tool
  hosting: "pkg.go.dev"                 # Automatic hosting for public Go modules

  # Content requirements
  sections:
    - name: "Installation"
      required: true
      content: "go get github.com/ziptax/ziptax-go"
    - name: "Quick Start"
      required: true
    - name: "Authentication"
      required: true
    - name: "API Reference"
      required: true
      auto_generate: true               # Generated from godoc comments
    - name: "Error Handling"
      required: true
    - name: "Examples"
      required: true
    - name: "Contributing"
      required: false
    - name: "Changelog"
      required: true

  # API documentation
  api_docs:
    include_request_examples: true
    include_response_examples: true
    include_error_examples: true
    format: "markdown"
    godoc_examples: true                # Include Example* test functions

# -----------------------------------------------------------------------------
# Examples
# -----------------------------------------------------------------------------
examples:
  - name: "Basic Usage"
    file: "examples/basic_usage/main.go"
    description: "Simple example showing basic SDK initialization and usage"
    required: true

  - name: "Concurrent Operations"
    file: "examples/concurrent_usage/main.go"
    description: "Example using goroutines for concurrent operations"
    required: true

  - name: "Error Handling"
    file: "examples/error_handling/main.go"
    description: "Demonstrates proper error handling patterns"
    required: true

  - name: "Context Timeout"
    file: "examples/context_timeout/main.go"
    description: "Using context for request timeouts and cancellation"
    required: false

# -----------------------------------------------------------------------------
# CI/CD Configuration
# -----------------------------------------------------------------------------
ci_cd:
  # Continuous Integration
  platform: "github_actions"

  workflows:
    - name: "Test"
      triggers: ["push", "pull_request"]
      jobs:
        - "lint"                        # golangci-lint
        - "fmt-check"                   # gofmt check
        - "test"                        # go test
        - "coverage"                    # coverage report
        - "vet"                         # go vet

    - name: "Publish"
      triggers: ["tag"]                 # Triggered on version tags (v*)
      jobs:
        - "build"
        - "tag-release"                 # GitHub release
        # Note: pkg.go.dev indexes automatically on tag push

  # Testing matrix
  test_matrix:
    go_versions: ["1.21", "1.22", "1.23"]
    os: ["ubuntu-latest", "macos-latest", "windows-latest"]

# -----------------------------------------------------------------------------
# Additional Instructions
# -----------------------------------------------------------------------------
# Any special instructions or considerations for this SDK
instructions:
  special_considerations:
    - "Use float64 for monetary values (tax rates are decimals)"
    - "ZIP codes should be validated for format"
    - "All public functions should accept context.Context as first parameter"
    - "All API responses should be properly typed with Go structs"
    - "Use pointer types for optional/nullable fields in structs"
    - "Follow Go idioms: errors are values, not exceptions"

  # Code patterns to follow
  patterns:
    - pattern: "Client initialization with functional options"
      example: |
        // Create a new client with ZipTax API key only (tax rate lookups)
        client := ziptax.NewClient(apiKey)

        // Or with options
        client := ziptax.NewClient(
            apiKey,
            ziptax.WithTimeout(30*time.Second),
            ziptax.WithRetry(3),
        )

        // Create client with TaxCloud credentials for order management
        client := ziptax.NewClient(
            apiKey,
            ziptax.WithTaxCloudConnectionID("25eb9b97-5acb-492d-b720-c03e79cf715a"),
            ziptax.WithTaxCloudAPIKey("taxcloud-api-key-here"),
        )

        // Full configuration with both APIs
        client := ziptax.NewClient(
            apiKey,
            ziptax.WithTimeout(30*time.Second),
            ziptax.WithRetry(3),
            ziptax.WithTaxCloudConnectionID("25eb9b97-5acb-492d-b720-c03e79cf715a"),
            ziptax.WithTaxCloudAPIKey("taxcloud-api-key-here"),
        )

    - pattern: "Context-based API calls"
      example: |
        ctx := context.Background()
        response, err := client.GetSalesTaxByAddress(ctx, "200 Spectrum Center Drive, Irvine, CA 92618")
        if err != nil {
            return fmt.Errorf("failed to get tax rates: %w", err)
        }

    - pattern: "Error handling with wrapped errors"
      example: |
        if err != nil {
            if errors.Is(err, ziptax.ErrInvalidAPIKey) {
                // Handle invalid API key
            }
            return fmt.Errorf("operation failed: %w", err)
        }

    - pattern: "Concurrent requests with goroutines"
      example: |
        var wg sync.WaitGroup
        results := make(chan *ziptax.V60Response, len(addresses))

        for _, addr := range addresses {
            wg.Add(1)
            go func(address string) {
                defer wg.Done()
                resp, err := client.GetSalesTaxByAddress(ctx, address)
                if err != nil {
                    log.Printf("error: %v", err)
                    return
                }
                results <- resp
            }(addr)
        }
        wg.Wait()
        close(results)

  # Avoid these patterns
  anti_patterns:
    - "Don't use global variables for client configuration"
    - "Don't ignore errors - always check and handle them"
    - "Don't create goroutines without proper synchronization"
    - "Avoid using panic in library code - return errors instead"
    - "Don't use naked returns in functions longer than a few lines"

