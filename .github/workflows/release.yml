name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify version.go matches tag
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.version }}"
          FILE_VERSION=$(grep -oP 'Version\s*=\s*"\K[^"]+' version.go)

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Tag version: $TAG_VERSION"
            echo "version.go: $FILE_VERSION"
            exit 1
          fi

          echo "✅ Version matches: $TAG_VERSION"

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 ${VERSION}^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release"
            NOTES="## 🎉 Initial Release

            This is the first release of the ZipTax Go SDK.

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for usage documentation."
          else
            echo "Generating notes from $PREV_TAG to $VERSION"

            # Get commit messages since last tag
            COMMITS=$(git log ${PREV_TAG}..${VERSION} --pretty=format:"- %s (%h)" --no-merges)

            NOTES="## 📝 Changes since ${PREV_TAG}

            ${COMMITS}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
          fi

          # Write to file for multiline output
          echo "$NOTES" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post success message
        run: |
          echo "✅ Release ${{ steps.get_version.outputs.tag }} created successfully!"
          echo "🔗 View release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.tag }}"
  notify-pkg-go-dev:
    name: Notify pkg.go.dev
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Trigger pkg.go.dev indexing
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          curl -X POST "https://proxy.golang.org/github.com/ziptax/ziptax-go/@v/${VERSION}.info"
          echo "Triggered pkg.go.dev indexing for version ${VERSION}"

      - name: Wait for indexing
        run: sleep 30

      - name: Verify package availability
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pkg.go.dev/github.com/ziptax/ziptax-go@${VERSION}")
          if [ "$STATUS" == "200" ]; then
            echo "Package is available on pkg.go.dev"
          else
            echo "Package may not be available yet (status: $STATUS)"
            echo "It may take a few minutes for pkg.go.dev to index the new version"
          fi