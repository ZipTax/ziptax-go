name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Changes in ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ```bash
            go get github.com/ziptax/ziptax-go@${{ steps.version.outputs.VERSION }}
            ```

            ## Documentation

            See the [README](https://github.com/ziptax/ziptax-go/blob/${{ steps.version.outputs.VERSION }}/README.md) for usage instructions.

            Full documentation is available at [pkg.go.dev](https://pkg.go.dev/github.com/ziptax/ziptax-go@${{ steps.version.outputs.VERSION }}).
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

  notify-pkg-go-dev:
    name: Notify pkg.go.dev
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Trigger pkg.go.dev indexing
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          curl -X POST "https://proxy.golang.org/github.com/ziptax/ziptax-go/@v/${VERSION}.info"
          echo "Triggered pkg.go.dev indexing for version ${VERSION}"

      - name: Wait for indexing
        run: sleep 30

      - name: Verify package availability
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pkg.go.dev/github.com/ziptax/ziptax-go@${VERSION}")
          if [ "$STATUS" == "200" ]; then
            echo "Package is available on pkg.go.dev"
          else
            echo "Package may not be available yet (status: $STATUS)"
            echo "It may take a few minutes for pkg.go.dev to index the new version"
          fi