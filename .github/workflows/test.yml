name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first leg to go red cancels every other leg, which
      # hides whether the rest actually pass and makes triage guesswork.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 'stable' tracks the current Go release. The pinned versions cover the
        # go.mod minimum (1.21) and the range between it and stable, so the
        # compatibility claim in the README stays verified as Go moves on.
        go-version: ['1.21', '1.22', '1.23', 'stable']
        exclude:
          # macOS 26's dyld refuses to load test binaries linked by Go <= 1.22:
          #   dyld: missing LC_UUID load command in .../pkg.test
          #   signal: abort trap
          # This is a toolchain limitation, not an SDK one. With these
          # toolchains on macOS 26, `go build` succeeds and ordinary
          # executables run fine; only `go test` binaries fail to load, with
          # or without -race. Go >= 1.23 is unaffected on the same OS.
          # Go 1.21 and 1.22 support stays verified on Linux and Windows.
          - os: macos-latest
            go-version: '1.21'
          - os: macos-latest
            go-version: '1.22'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v /examples/)

      - name: Generate coverage report
        shell: bash
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=80
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "Coverage ${COVERAGE}% is below threshold of ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage check passed!"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run golangci-lint
        # v4 caps at the golangci-lint v1 line, where 'latest' resolves to
        # v1.64.8. That binary is built with Go 1.24 and cannot typecheck code
        # under a newer toolchain, failing with:
        #   file requires newer Go version go1.26 (application built with go1.24)
        # v9 installs golangci-lint v2, which tracks current Go and matches the
        # version `make lint` uses locally.
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Check imports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          if [ -n "$(goimports -l .)" ]; then
            echo "The following files have unorganized imports:"
            goimports -l .
            exit 1
          fi

  mod-tidy:
    name: Go Mod Tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go.mod or go.sum is not up to date"
            git diff
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: go build ./...

      - name: Build examples
        run: go build ./examples/...